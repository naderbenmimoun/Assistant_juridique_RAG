services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The minimal Qdrant image has no curl/wget. FastAPI separately verifies
      # the real API with bounded retries before it starts.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  ollama:
    image: ollama/ollama:0.9.6
    # Expose the NVIDIA GPU through Docker Desktop/WSL to Ollama.
    gpus: all
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  ollama-pull:
    image: ollama/ollama:0.9.6
    entrypoint:
      - /bin/sh
      - -c
      - 'ollama pull "$$OLLAMA_CHAT_MODEL" && ollama pull "$$OLLAMA_EMBEDDING_MODEL"'
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    command: ["uvicorn", "app.main:app", "--host", "${APP_HOST:-0.0.0.0}", "--port", "${APP_PORT:-8000}"]
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('APP_PORT', '8000') + '/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  qdrant_data:
  ollama_data:
